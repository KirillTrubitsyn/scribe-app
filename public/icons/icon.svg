<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fed7aa;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg-gradient)"/>
  <!-- Microphone body -->
  <rect x="206" y="96" width="100" height="180" rx="50" fill="white"/>
  <!-- Microphone stand arc -->
  <path d="M156 220 Q156 340 256 340 Q356 340 356 220" fill="none" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Microphone stand vertical -->
  <line x1="256" y1="340" x2="256" y2="400" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Microphone base -->
  <line x1="186" y1="400" x2="326" y2="400" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M380 180 Q420 256 380 332" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.7"/>
  <path d="M420 140 Q480 256 420 372" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
</svg>
